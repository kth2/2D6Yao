<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="六爻預測">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfaf4" />
      <stop offset="1" stop-color="#efe6d3" />
    </linearGradient>
  </defs>

  <rect x="6" y="6" width="500" height="500" rx="110" fill="url(#paper)" stroke="#d6c6a1" stroke-width="4" />

  <!-- 罗盘环：外圈、虚线内圈、周天点位 -->
  <g fill="none" stroke="#b89a54">
    <circle cx="256" cy="196" r="126" stroke-width="2.5" />
    <circle cx="256" cy="196" r="106" stroke-width="1.2" stroke-dasharray="2 9" />
    <circle cx="256" cy="196" r="143" stroke-width="1" opacity="0.55" />
  </g>
  <g fill="#b89a54">
    <circle cx="256" cy="53" r="6" />
    <circle cx="399" cy="196" r="6" />
    <circle cx="256" cy="339" r="6" />
    <circle cx="113" cy="196" r="6" />
    <circle cx="357" cy="95" r="3.6" />
    <circle cx="357" cy="297" r="3.6" />
    <circle cx="155" cy="297" r="3.6" />
    <circle cx="155" cy="95" r="3.6" />
    <circle cx="327" cy="66" r="2.6" />
    <circle cx="386" cy="125" r="2.6" />
    <circle cx="386" cy="267" r="2.6" />
    <circle cx="327" cy="326" r="2.6" />
    <circle cx="185" cy="326" r="2.6" />
    <circle cx="126" cy="267" r="2.6" />
    <circle cx="126" cy="125" r="2.6" />
    <circle cx="185" cy="66" r="2.6" />
  </g>

  <!-- 水火既济：初爻起阳，阴阳相间。阳爻墨色整划，阴爻金色分作两段（不靠色块遮挡，免得压不住底色渐变）。 -->
  <g>
    <rect x="190" y="130" width="53" height="13" rx="2" fill="#a9873c" />
    <rect x="269" y="130" width="53" height="13" rx="2" fill="#a9873c" />

    <rect x="190" y="154" width="132" height="13" rx="2" fill="#1f1a14" />

    <rect x="190" y="178" width="53" height="13" rx="2" fill="#a9873c" />
    <rect x="269" y="178" width="53" height="13" rx="2" fill="#a9873c" />

    <rect x="190" y="202" width="132" height="13" rx="2" fill="#1f1a14" />

    <rect x="190" y="226" width="53" height="13" rx="2" fill="#a9873c" />
    <rect x="269" y="226" width="53" height="13" rx="2" fill="#a9873c" />

    <rect x="190" y="250" width="132" height="13" rx="2" fill="#1f1a14" />
  </g>

  <text x="256" y="406" text-anchor="middle" font-size="82" font-weight="700" letter-spacing="6"
        font-family="'Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun',serif" fill="#1c1611">六爻預測</text>
  <line x1="152" y1="432" x2="360" y2="432" stroke="#c4ab77" stroke-width="2" />
  <text x="256" y="466" text-anchor="middle" font-size="30" letter-spacing="2"
        font-family="'Noto Serif CJK SC','Songti SC','SimSun',serif" fill="#6d5c3e">2D 六爻預測</text>
</svg>
